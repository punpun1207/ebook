<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Book Spine / Center Line -->
  <path d="M256 160 L256 380" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Open Book Pages -->
  <path d="M256 180 C210 150, 140 155, 100 170 L100 360 C140 345, 210 340, 256 370 C302 340, 372 345, 412 360 L412 170 C372 155, 302 150, 256 180 Z" fill="url(#bookGrad)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.18))"/>
  
  <!-- Book Page Lines Left -->
  <line x1="135" y1="215" x2="225" y2="215" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="135" y1="250" x2="225" y2="250" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="135" y1="285" x2="195" y2="285" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

  <!-- Sound Waves Right -->
  <path d="M295 235 C315 220, 315 280, 295 265" stroke="#d97706" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M325 215 C355 190, 355 310, 325 285" stroke="#d97706" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M355 195 C395 160, 395 340, 355 305" stroke="#d97706" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
